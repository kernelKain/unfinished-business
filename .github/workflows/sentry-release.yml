name: Verify application

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the platform OpenCode CLI
        run: npm run diagnose:platform

      - name: Typecheck
        run: npm run typecheck

      - name: Test workspace path safety and platform resolution
        run: npm run test:platform

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the OpenCode server
        run: npm run smoke:opencode

      - name: Preserve the deployable browser artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-business-web-${{ github.sha }}
          path: dist/web
          if-no-files-found: error
          retention-days: 14

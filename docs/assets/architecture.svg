<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Unfinished Business system architecture</title>
  <desc id="desc">A clean architecture diagram comparing the public read-only Render demo with the full local workflow connected to the user's OpenCode server, provider, and managed workspace.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#59616c"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17191d; }
      .subtitle { font: 400 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #59616c; }
      .section { font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17191d; }
      .eyebrow { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #67558b; letter-spacing: .08em; }
      .label { font: 650 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #20242a; }
      .body { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #59616c; }
      .note { font: 550 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #343a43; }
      .panel { fill: #ffffff; stroke: #cfd3d8; stroke-width: 1.5; }
      .box { fill: #f7f7f5; stroke: #aeb4bc; stroke-width: 1.25; }
      .box-accent { fill: #f5f1fb; stroke: #8f7caf; stroke-width: 1.25; }
      .line { fill: none; stroke: #59616c; stroke-width: 1.75; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7b838d; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f3f3f0"/>
  <text x="56" y="55" class="title">System architecture</text>
  <text x="56" y="83" class="subtitle">One interface, with a strict boundary between the hosted preview and real local execution.</text>

  <rect x="48" y="118" width="420" height="500" rx="12" class="panel"/>
  <text x="76" y="154" class="eyebrow">PUBLIC PATH</text>
  <text x="76" y="184" class="section">Read-only Render demo</text>
  <text x="76" y="208" class="body">For judges and visitors. No account or provider access required.</text>

  <rect x="84" y="248" width="348" height="76" rx="8" class="box"/>
  <text x="106" y="278" class="label">Visitor browser</text>
  <text x="106" y="301" class="body">Landing page and guided Driftwatch sample</text>
  <path d="M258 324V358" class="line"/>

  <rect x="84" y="362" width="348" height="94" rx="8" class="box"/>
  <text x="106" y="392" class="label">Render web service</text>
  <text x="106" y="415" class="body">React interface + Hono API</text>
  <text x="106" y="437" class="body">Serves a deterministic recorded fixture</text>
  <path d="M258 456V490" class="line"/>

  <rect x="84" y="494" width="348" height="86" rx="8" class="box-accent"/>
  <text x="106" y="524" class="label">Safe preview boundary</text>
  <text x="106" y="547" class="body">No OpenCode process, provider key, repository</text>
  <text x="106" y="567" class="body">access, visitor writes, or persistent project state</text>

  <rect x="500" y="118" width="732" height="500" rx="12" class="panel"/>
  <text x="528" y="154" class="eyebrow">LOCAL PATH</text>
  <text x="528" y="184" class="section">Full workshop on the user's machine</text>
  <text x="528" y="208" class="body">For real model work. The user owns the provider, permissions, repository, and approvals.</text>

  <rect x="536" y="248" width="218" height="76" rx="8" class="box-accent"/>
  <text x="558" y="278" class="label">Human + browser</text>
  <text x="558" y="301" class="body">Reviews and approves each stage</text>
  <path d="M754 286H790" class="line"/>

  <rect x="794" y="248" width="384" height="76" rx="8" class="box"/>
  <text x="816" y="278" class="label">Unfinished Business server</text>
  <text x="816" y="301" class="body">Workflow policy, revisions, runs, and atomic project state</text>
  <path d="M986 324V358" class="line"/>

  <rect x="794" y="362" width="384" height="94" rx="8" class="box"/>
  <text x="816" y="392" class="label">User's OpenCode server</text>
  <text x="816" y="415" class="body">Model catalog, agent sessions, tools, and permissions</text>
  <text x="816" y="437" class="body">Provider credentials remain inside OpenCode</text>

  <rect x="536" y="371" width="218" height="76" rx="8" class="box"/>
  <text x="558" y="401" class="label">Chosen provider</text>
  <text x="558" y="424" class="body">OpenCode Go or a local model</text>
  <path d="M754 409H790" class="dash"/>
  <path d="M986 456V490" class="line"/>

  <rect x="794" y="494" width="384" height="86" rx="8" class="box"/>
  <text x="816" y="524" class="label">Managed local workspace</text>
  <text x="816" y="547" class="body">Bounded Maker scope, observed diff, and check evidence</text>
  <text x="816" y="567" class="body">Native OpenCode permission decisions remain authoritative</text>

  <rect x="536" y="494" width="218" height="86" rx="8" class="box-accent"/>
  <text x="558" y="524" class="label">Approval gates</text>
  <text x="558" y="547" class="body">Oracle → Architect</text>
  <text x="558" y="567" class="body">→ Maker → Witness</text>

  <rect x="48" y="646" width="1184" height="44" rx="8" fill="#e9e7ee" stroke="#b9afca"/>
  <text x="68" y="674" class="note">Trust rule: the browser never receives a provider API key, and an app approval never overrides an OpenCode permission decision.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Unfinished Business architecture</title>
  <desc id="desc">Two separate paths share one interface. The public Render preview serves a read-only recorded journey. The local workshop connects through a Hono server to a user-owned OpenCode server, provider, and isolated workspace. Human approvals gate each workflow stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120f1f"/>
      <stop offset="1" stop-color="#21152a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#f59c62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#08060d" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d9cce4"/>
    </marker>
    <style>
      .heading { font: 700 30px system-ui, -apple-system, Segoe UI, sans-serif; fill: #fff8ec; }
      .subheading { font: 650 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #fff8ec; }
      .label { font: 650 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #fff8ec; }
      .body { font: 400 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #d9cce4; }
      .small { font: 550 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #b9a9c5; letter-spacing: .04em; }
      .box { fill: #2b2036; stroke: #695677; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .box-warm { fill: #36262f; stroke: #f5ad68; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .line { fill: none; stroke: #d9cce4; stroke-width: 2; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #a993b8; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="24" fill="url(#bg)"/>
  <text x="64" y="62" class="heading">One interface, two deliberately separate paths</text>
  <text x="64" y="91" class="body">The public preview explains the product. Real model access and code work stay on the user's machine.</text>

  <rect x="48" y="124" width="410" height="548" rx="22" fill="#191421" stroke="#4b3b58" stroke-width="2"/>
  <text x="76" y="166" class="subheading">Public judge preview</text>
  <text x="76" y="190" class="small">RENDER · HOSTED-DEMO MODE</text>

  <rect x="86" y="225" width="332" height="90" class="box"/>
  <text x="112" y="258" class="label">Browser</text>
  <text x="112" y="282" class="body">Landing page + recorded Driftwatch journey</text>
  <text x="112" y="302" class="body">No login or local-machine connection</text>

  <path d="M252 315V356" class="line"/>
  <text x="271" y="342" class="small">HTTPS</text>

  <rect x="86" y="360" width="332" height="112" class="box"/>
  <text x="112" y="393" class="label">Render web service</text>
  <text x="112" y="417" class="body">React interface + Hono read-only API</text>
  <text x="112" y="439" class="body">Serves a deterministic recorded fixture</text>
  <text x="112" y="459" class="body">Mutation routes rejected server-side</text>

  <rect x="86" y="516" width="332" height="112" rx="16" fill="#201a28" stroke="#6b5b75" stroke-width="1.5"/>
  <text x="112" y="549" class="label">Intentionally absent</text>
  <text x="112" y="574" class="body">No OpenCode process · no provider key</text>
  <text x="112" y="596" class="body">No repository access · no visitor persistence</text>

  <rect x="492" y="124" width="740" height="548" rx="22" fill="#191421" stroke="#725846" stroke-width="2"/>
  <text x="520" y="166" class="subheading">Real local workshop</text>
  <text x="520" y="190" class="small">LOOPBACK · USER-OWNED OPENCODE</text>

  <rect x="530" y="225" width="270" height="90" class="box-warm"/>
  <text x="556" y="258" class="label">Human + browser</text>
  <text x="556" y="282" class="body">Approves proposals, exact versions,</text>
  <text x="556" y="302" class="body">Maker scope, and final evidence</text>

  <path d="M800 270H845" class="line"/>
  <text x="805" y="250" class="small">LOOPBACK</text>

  <rect x="850" y="225" width="334" height="90" class="box"/>
  <text x="876" y="258" class="label">Unfinished Business server</text>
  <text x="876" y="282" class="body">Hono API · workflow policy · revisions</text>
  <text x="876" y="302" class="body">Atomic project state + evidence references</text>

  <path d="M1017 315V356" class="line"/>
  <text x="1038" y="342" class="small">POLICY-CHECKED CLIENT</text>

  <rect x="850" y="360" width="334" height="112" class="box"/>
  <text x="876" y="393" class="label">User's OpenCode server</text>
  <text x="876" y="417" class="body">Model catalog · agent loop · native sessions</text>
  <text x="876" y="439" class="body">Tools · permissions · cancellation</text>
  <text x="876" y="459" class="body">Provider credentials remain here</text>

  <path d="M850 416H782" class="line-dashed"/>
  <rect x="530" y="372" width="246" height="88" class="box"/>
  <text x="556" y="404" class="label">OpenCode provider</text>
  <text x="556" y="428" class="body">OpenCode Go, another provider,</text>
  <text x="556" y="448" class="body">or a local model chosen by the user</text>

  <path d="M1017 472V515" class="line"/>
  <text x="1038" y="500" class="small">BOUNDED SCOPE</text>

  <rect x="850" y="520" width="334" height="108" class="box"/>
  <text x="876" y="553" class="label">Managed local workspace</text>
  <text x="876" y="577" class="body">Maker target below UB_DATA_DIR</text>
  <text x="876" y="599" class="body">Observed diff + bounded check evidence</text>

  <rect x="530" y="520" width="246" height="108" rx="16" fill="#211a28" stroke="#f5ad68" stroke-width="1.5"/>
  <text x="556" y="553" class="label">Approval gates</text>
  <text x="556" y="578" class="body">Oracle → Architect → Maker → Witness</text>
  <text x="556" y="600" class="body">Model output proposes; humans authorize</text>

  <rect x="48" y="700" width="1184" height="2" fill="url(#warm)" opacity="0.75"/>
  <text x="64" y="730" class="small">TRUST RULE</text>
  <text x="160" y="730" class="body">The browser never receives a provider API key, and an app approval never overrides an OpenCode permission decision.</text>
</svg>
